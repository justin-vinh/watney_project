[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "watney"
version = "3.0.3"

description = "Interactive NiceGUI oncology annotation platform for reviewing LLM-extracted progression events and systemic therapy timelines."

readme = "README.md"

requires-python = ">=3.10"

authors = [
    { name = "Justin Vinh", email = "jvinh21@gmail.com" }
]

license = { file = "LICENSE" }

urls = { Homepage = "https://github.com/justin-vinh/watney" }

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "nicegui>=2.0",
    "orjson>=3.10",
    "json-repair>=0.59",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "requests>=2.31",
]

[project.scripts]
watney = "watney.watney_v3:main"

[tool.flit.module]
name = "watney"

[tool.ruff]
line-length = 99
src = ["watney"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["watney"]
force-sort-within-sections = true